<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>java script test</title>
</head>
<body>
    <!-- //JavaScript is a scriptted language because for executing it requires another language.
We can declare the <script> tag anywhere in head or body but usuallly used in body.: -->
    <script>
        //For printing
        console.log("Hello js"); //console is a developer tool for printing the output in the console of the browser
        document.write("Hello Js"); //document.write is used to print the output in the body of the html page (in the white area of the page)
        alert("Hello Js"); //alert is used to print the output in the form of a pop-up box. Alert  works only in reload because it is a blocking function. It will block the execution of the code until the user clicks on the ok button of the alert box. DOM(Document Object Model) always prioritise the alert box over the other elements of the page. It is used for debugging purpose.
    </script>
</body>
</html>

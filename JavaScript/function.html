<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions in JS</title>
</head>
<body>
    <script>
        //function
        function abes(){
            document.write("<br> Hi, We are coders.");
        }

        //function calling
        abes();
        abes();
        abes();
        abes();
        
        //parameterized function
        function add(a, b){
            return a+b;
        }
        document.write("<br>" + add(10, 20));
        document.write("<br> " + add(20, 30));

        
    </script>
</body>
</html>

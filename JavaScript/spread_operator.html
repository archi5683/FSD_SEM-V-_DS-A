<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
</head>
<body>
    <script>
        //what spread operator does is it takes all the elements from an array and puts them into another array. It is represented by three dots (...).
        const a11 = [1, 2, 3];
        const b11 = [4, 5, 6];
        const c = [...a11, ...b11];
        document.write(c + "<br>");
    </script>
</body>
</html>

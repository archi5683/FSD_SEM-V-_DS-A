<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //filter() method is used to filter the array based on the condition provided in the callback function.
        const num = [21, 32, 73, 44, 55, 66, 77, 88, 99];

        const evenNum = num.filter((i) => i%2==0);
        console.log("Num", num);
        console.log("Even Numbers", evenNum);
    </script>
</body>
</html>

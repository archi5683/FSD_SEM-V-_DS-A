<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays in JavaScript</title>
</head>
<body>
    <script>
        let car = ["BMW", "Volvo", "Saab", "Ford"]; 
        for(let i=0; i<car.length; i++){
            document.write("<br>"+car[i]);
        }
    </script>
</body>
</html>

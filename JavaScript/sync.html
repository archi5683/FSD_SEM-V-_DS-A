<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronous JavaScript (Sync)</title>
</head>
<body>
    <script>
        //what synchronous JavaScript does is it executes the code line by line. It means that the next line of code will not be executed until the current line of code is finished executing.
        document.write("Hello World!<br>");
        document.write("This is synchronous JavaScript.<br>");
        document.write("It executes the code line by line.<br>");
    </script>
</body>
</html>

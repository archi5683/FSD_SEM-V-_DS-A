<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions</title>
</head>
<body>
    <script>
        const abes = () => {
            document.write("<br> Hi.");
        }
        abes();
        //parameterized arrow function
        const add = (a, b) => {
            return a + b;
        }
        document.write("<br>" + add(10, 20));
        document.write("<br>" + add(20, 30));

    </script>
</body>
</html>

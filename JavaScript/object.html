<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        // Object format 
        //datatype object_name = {key:value, key:value, key:value} 
        // Everything under curly braces is called as object.

        //creating object

        const student ={
            name: "Archi",
            class: "B. Tech",
            fee: 100000
        }

        document.write("<br>" + student.name);
        document.write("<br>" + student.class);
        document.write("<br>" + student.fee);

        
    </script>
</body>
</html>
